# Aquest fitxer viu al repo PUBLIC consultamedx-ai/consultamed-escriptori-releases
# (.github/workflows/instal·ladors.yml). Aqui, al repo de l'app, n'hi ha la copia mestra.
#
# Construeix els instal·ladors d'una versio del programa (etiqueta v* del repo privat de l'app):
# Windows (NSIS .exe amb el WebView2 inclos) i macOS (.dmg per a Apple Silicon i per a Intel),
# els FIRMA per a l'actualitzador i deixa un ESBORRANY de Release en aquest mateix repo, amb el
# latest.json de l'updater i els noms estables per a la pagina de descarrega. Sense signatura de
# codi (decisio del CEO): SmartScreen i Gatekeeper avisaran.
#
# Des del 23/09/2026 (ENG-31 S, P-ENG-56) la clau de firma NO es a l'abast de la construccio:
#   1. «construir» compila SENSE cap secret de firma (npm, cargo i tots els build.rs corren sense la clau);
#   2. «firmar-i-publicar» corre a l'entorn «firma» de GitHub, que demana l'APROVACIO d'en Roger; els
#      dos secrets de la clau nomes viuen en aquest entorn (els hi posa «Protegeix la clau de firma.command»)
#      i nomes s'exposen al pas que firma. Els «actions» van fixats per SHA de commit; des del 22/10/2026
#      (ENG-36 ④), a versions que corren amb Node 24.
#   3. (ENG-36 ③) Si la Release d'aquella versio JA ES PUBLICADA, el flux s'atura i no hi toca res: nomes
#      s'actualitza un ESBORRANY (per a una versio publicada, una etiqueta nova: v0.0.5…).
#   4. (22/10/2026) Una sola execucio alhora per versio (la segona espera que la primera acabi: mai un esborrany
#      amb fitxers de dues construccions barrejats, que faria que el latest.json no casés amb l'instal·lador); el
#      codi de l'app es el de l'ETIQUETA (refs/tags/…); cap checkout deixa la clau de desplegament als passos
#      seguents (persist-credentials: false); els artefactes es guarden 14 dies (temps per aprovar la firma).
#
# Es llança a ma: Actions → instal·ladors → Run workflow → versio (p. ex. v0.0.3). Quan la construccio
# acaba, GitHub avisa en Roger perque aprovi la firma (Review deployments → firma → Approve).
# Secrets d'aquest repo (STOP-2, sense cap token personal):
#   APP_DEPLOY_KEY   deploy key de lectura del repo privat consultamedx-ai/consultamed-escriptori
#   WEB_DEPLOY_KEY   deploy key de lectura del repo privat consultamedx-ai/landing-facturamed
# Secrets de l'ENTORN «firma»:
#   TAURI_SIGNING_PRIVATE_KEY           clau privada del updater (minisign), MAI al codi ni als registres
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  la seva contrasenya
name: instal·ladors
run-name: instal·ladors ${{ inputs.versio }}

on:
  workflow_dispatch:
    inputs:
      versio:
        description: 'Etiqueta de la versio al repo de l''app (p. ex. v0.0.3)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: installadors-${{ inputs.versio }}
  cancel-in-progress: false

jobs:
  construir:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
            nom: windows
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            nom: macos-aarch64
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            nom: macos-x86_64
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Cap conversio de finals de linia (a Windows, git posaria CRLF i les comprovacions byte a byte fallarien)
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)
        with:
          persist-credentials: false
      - name: Codi de l'app (repo privat, a l'etiqueta demanada)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)
        with:
          repository: consultamedx-ai/consultamed-escriptori
          ssh-key: ${{ secrets.APP_DEPLOY_KEY }}
          ref: refs/tags/${{ inputs.versio }}
          path: app
          persist-credentials: false
      - name: Pagines de la web (repo privat, pinnades a PAGINES.lock)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)
        with:
          repository: consultamedx-ai/landing-facturamed
          ssh-key: ${{ secrets.WEB_DEPLOY_KEY }}
          path: web
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (Node 24)
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, llegit el 23/09/2026
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 (ja Node 24)
        with:
          workspaces: app/src-tauri
      - name: Dependencies, paquet de pagines i proves
        working-directory: app
        env:
          CM_WEB_CLON: ${{ github.workspace }}/web
        run: |
          npm ci
          npm run prova:empaqueta
          npm run empaqueta
          npm run prova:llicencies
      - name: Rust (proves)
        working-directory: app
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Construir SENSE la clau de firma (els artefactes del updater es firmen al pas seguent)
        working-directory: app
        shell: bash
        env:
          CM_WEB_CLON: ${{ github.workspace }}/web
        run: npm run tauri -- build ${{ matrix.args }} --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Artefactes amb nom estable
        working-directory: app/src-tauri
        shell: bash
        run: |
          S="$GITHUB_WORKSPACE/sortida"; mkdir -p "$S"
          case "${{ matrix.nom }}" in
            windows)
              cp target/release/bundle/nsis/*-setup.exe "$S/ConsultaMed-Windows.exe" ;;
            macos-aarch64)
              cp target/aarch64-apple-darwin/release/bundle/dmg/*.dmg "$S/ConsultaMed-macOS-AppleSilicon.dmg"
              tar -czf "$S/ConsultaMed_aarch64.app.tar.gz" -C target/aarch64-apple-darwin/release/bundle/macos ConsultaMed.app ;;
            macos-x86_64)
              cp target/x86_64-apple-darwin/release/bundle/dmg/*.dmg "$S/ConsultaMed-macOS-Intel.dmg"
              tar -czf "$S/ConsultaMed_x64.app.tar.gz" -C target/x86_64-apple-darwin/release/bundle/macos ConsultaMed.app ;;
          esac
          ls -la "$S"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (Node 24)
        with:
          name: ${{ matrix.nom }}
          path: sortida/
          if-no-files-found: error
          retention-days: 14

  firmar-i-publicar:
    needs: construir
    runs-on: ubuntu-latest
    # L'entorn «firma» demana l'aprovacio d'en Roger i es l'UNIC lloc on viuen els secrets de la clau.
    environment: firma
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0 (Node 24)
        with:
          path: sortida
          merge-multiple: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (Node 24)
        with:
          node-version: 22
      - name: CLI de Tauri (per firmar)
        run: npm i -g @tauri-apps/cli@2.11.4
      - name: Firmar els artefactes del updater (la clau NOMES en aquest pas)
        working-directory: sortida
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || { echo "✗ No hi ha la clau de firma a l'entorn «firma» (Protegeix la clau de firma.command)"; exit 1; }
          for f in ConsultaMed-Windows.exe ConsultaMed_aarch64.app.tar.gz ConsultaMed_x64.app.tar.gz; do
            [ -f "$f" ] || { echo "✗ falta $f"; exit 1; }
            tauri signer sign "$f"
            [ -s "$f.sig" ] || { echo "✗ sense firma per a $f"; exit 1; }
          done
          ls -la
      - name: latest.json (totes les URL https i d'aquest repo)
        env:
          VERSIO: ${{ inputs.versio }}
          REPO: ${{ github.repository }}
        run: |
          cat > genera-latest.cjs <<'JS'
          const fs = require('fs');
          const versio = process.env.VERSIO.replace(/^v/, '');
          const base = 'https://github.com/' + process.env.REPO + '/releases/download/' + process.env.VERSIO + '/';
          const e = (f) => ({ url: base + f, signature: fs.readFileSync('sortida/' + f + '.sig', 'utf8').trim() });
          const platforms = {
            'darwin-aarch64': e('ConsultaMed_aarch64.app.tar.gz'), 'darwin-aarch64-app': e('ConsultaMed_aarch64.app.tar.gz'),
            'darwin-x86_64': e('ConsultaMed_x64.app.tar.gz'), 'darwin-x86_64-app': e('ConsultaMed_x64.app.tar.gz'),
            'windows-x86_64': e('ConsultaMed-Windows.exe'), 'windows-x86_64-nsis': e('ConsultaMed-Windows.exe'),
          };
          for (const [k, p] of Object.entries(platforms)) {
            if (!/^https:\/\/github\.com\/consultamedx-ai\/[^/]+\/releases\/download\//.test(p.url)) { console.error('✗ URL no https o d\'un altre lloc: ' + k + ' ' + p.url); process.exit(1); }
            if (!/^[A-Za-z0-9+/=\s]+$/.test(p.signature) || p.signature.length < 100) { console.error('✗ firma estranya: ' + k); process.exit(1); }
          }
          fs.writeFileSync('sortida/latest.json', JSON.stringify({ version: versio, notes: 'Instal·ladors de ConsultaMed Escriptori. Windows: ConsultaMed-Windows.exe (avis SmartScreen: «Más información → Ejecutar de todas formas»). macOS: .dmg (Gatekeeper: clic dret → Abrir).', pub_date: new Date().toISOString(), platforms }, null, 2) + '\n');
          console.log(fs.readFileSync('sortida/latest.json', 'utf8').replace(/"signature": "[^"]{20}[^"]*"/g, '"signature": "…"'));
          JS
          node genera-latest.cjs
      - name: Esborrany de Release (mai es publica des d'aqui)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSIO: ${{ inputs.versio }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$VERSIO" -R "$REPO" >/dev/null 2>&1; then
            # ENG-36 ③: nomes es reemplacen els fitxers d'un ESBORRANY; una Release publicada no es toca mai
            ESBORRANY="$(gh release view "$VERSIO" -R "$REPO" --json isDraft --jq .isDraft 2>/dev/null)"
            if [ "$ESBORRANY" != "true" ]; then
              echo "✗ La Release $VERSIO ja es PUBLICADA (o no se n'ha pogut llegir l'estat): no es toca cap fitxer. Per a una versio nova, una etiqueta nova."
              exit 1
            fi
            gh release upload "$VERSIO" sortida/* --clobber -R "$REPO"
          else
            gh release create "$VERSIO" sortida/* --draft --title "ConsultaMed $VERSIO" -R "$REPO" \
              --notes "Instal·ladors de ConsultaMed Escriptori. Windows: ConsultaMed-Windows.exe (avis SmartScreen: «Más información → Ejecutar de todas formas»). macOS: .dmg (Gatekeeper: clic dret → Abrir). Avisos de llicencies de tercers: dins del programa (Ayuda → Avisos de licencias de terceros)."
          fi
          gh release view "$VERSIO" -R "$REPO" --json isDraft,assets --jq '"esborrany: " + (.isDraft|tostring) + " · " + ([.assets[].name] | join(", "))'
